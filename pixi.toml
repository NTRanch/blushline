# Blushline kernel environment — pin of record for the Mojo reference.
# The stdlib changes between Mojo releases, so the kernel's compiler is
# pinned exactly; the conformance vectors, not the source, are the
# durable contract. NOT installed in the v1.0 build sandbox (no Mojo
# toolchain there); this manifest is what a Mojo-equipped host uses to
# regenerate the vectors from core/kernel.mojo.

[project]
name = "blushline-kernel"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
mojo = "0.25.6.1"
